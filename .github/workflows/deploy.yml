name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: write   # required to push the deploy tag

env:
  AWS_REGION: ap-south-1
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  DEPLOY_BUCKET: rootstratum-deployments-865780387311

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history and tags, needed to work out the next version

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build Next.js
        working-directory: web
        run: npm run build
        env:
          NODE_ENV: production

      - name: Package standalone build
        working-directory: web
        run: |
          # Copy static assets into the standalone bundle (Next.js requirement)
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          tar -czf /tmp/deploy.tar.gz -C .next/standalone .

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Upload build to S3
        run: |
          aws s3 cp /tmp/deploy.tar.gz \
            s3://${{ env.DEPLOY_BUCKET }}/latest/deploy.tar.gz \
            --region ${{ env.AWS_REGION }}
          echo "Build uploaded to S3."

      - name: Deploy via SSM SendCommand
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["/opt/rootstratum/deploy.sh"]' \
            --timeout-seconds 120 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Poll for up to 2 minutes (deploy is now just S3 download + pm2 restart)
          for i in $(seq 1 12); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "[$i/12] Status: $STATUS"

            if [[ "$STATUS" == "Success" ]]; then
              echo "Deployment succeeded."
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              exit 0
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              echo "Deployment failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
            sleep 10
          done

          echo "Timed out waiting for deployment."
          exit 1

      - name: Tag this deploy
        run: |
          # Next version from the commits since the last vX.Y.Z tag:
          # breaking change -> major, feat -> minor, anything else -> patch.
          LAST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [[ -z "$LAST" ]]; then
            echo "No existing vX.Y.Z tag found; skipping tagging."
            exit 0
          fi
          if [[ -n "$(git tag --points-at HEAD --list 'v[0-9]*')" ]]; then
            echo "This commit is already tagged; nothing to do."
            exit 0
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "${LAST#v}"
          SUBJECTS=$(git log --format=%s "$LAST"..HEAD)
          BODIES=$(git log --format=%b "$LAST"..HEAD)
          if grep -qE '^[a-z]+(\([^)]*\))?!:' <<< "$SUBJECTS" || grep -q 'BREAKING CHANGE' <<< "$BODIES"; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif grep -qE '^feat(\([^)]*\))?:' <<< "$SUBJECTS"; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          TAG="v${MAJOR}.${MINOR}.${PATCH}"
          git tag "$TAG" "${{ github.sha }}"
          git push origin "$TAG"
          echo "Tagged ${{ github.sha }} as $TAG (previous: $LAST)"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3TLWGA4WUF6MC \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text
          echo "CloudFront invalidation submitted."
