name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  AWS_REGION: ap-south-1
  # Set this to your EC2 instance ID (not IP) — find it in EC2 console or:
  # aws ec2 describe-instances --filters "Name=ip-address,Values=65.0.246.204" \
  #   --query "Reservations[0].Instances[0].InstanceId" --output text
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build Next.js
        working-directory: web
        run: npm run build
        env:
          NODE_ENV: production

      - name: Debug OIDC token claims
        id: oidc-debug
        run: |
          TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "Token received (first 20 chars): ${TOKEN:0:20}"
          # Decode payload (base64url middle segment)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | \
            awk '{ pad=4-length($0)%4; if(pad<4){for(i=0;i<pad;i++) $0=$0"="} print }' | base64 -d 2>/dev/null)
          echo "sub: $(echo "$PAYLOAD" | jq -r '.sub // "missing"')"
          echo "aud: $(echo "$PAYLOAD" | jq -r '.aud // "missing"')"
          echo "iss: $(echo "$PAYLOAD" | jq -r '.iss // "missing"')"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy via SSM SendCommand
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["/opt/rootstratum/deploy.sh"]' \
            --timeout-seconds 300 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Poll until done
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "[$i/30] Status: $STATUS"

            if [[ "$STATUS" == "Success" ]]; then
              echo "Deployment succeeded."
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              exit 0
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              echo "Deployment failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
            sleep 10
          done

          echo "Timed out waiting for deployment."
          exit 1
